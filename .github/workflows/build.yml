name: Build and Release Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Bump Version, Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        id: bump
        run: |
          # Bump package.json version
          npm version patch --no-git-tag-version
          
          # Extract the new version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          
          # Sync version with chrome/manifest.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const manifest = JSON.parse(fs.readFileSync('chrome/manifest.json', 'utf8'));
            manifest.version = pkg.version;
            fs.writeFileSync('chrome/manifest.json', JSON.stringify(manifest, null, 2) + '\n', 'utf8');
          "

      - name: Commit and Push Version Bump
        run: |
          git add package.json chrome/manifest.json
          git commit -m "chore: bump version to v${{ env.NEW_VERSION }} [skip ci]"
          git push origin main

      - name: Tag Release
        run: |
          git tag "v${{ env.NEW_VERSION }}"
          git push origin "v${{ env.NEW_VERSION }}"

      - name: Install dependencies
        run: npm ci

      - name: Build Extension
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: faststream-extension-v${{ env.NEW_VERSION }}
          path: |
            built/*.zip
            built/*.xpi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: Release v${{ env.NEW_VERSION }}
          body: |
            Automated release of FastStream extension version ${{ env.NEW_VERSION }}.
            
            This release contains the following built packages:
            - Chrome Extension (Chrome Store / Libre Distribution)
            - Firefox Extension (Libre Distribution)
          draft: false
          prerelease: false
          files: |
            built/*.zip
            built/*.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
